<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>EkiLink</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="EkiLink" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- deck.gl 本体 -->
    <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
    <!-- MapLibre/Mapbox連携用の追加ライブラリ -->
    <script src="https://unpkg.com/@deck.gl/mapbox@8.9.33/dist.min.js"></script>

    <!-- カスタムCSS -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- 駅ごとのJavaScriptファイル -->
    <script src="./js/stations/shinjuku.js"></script>
    <script src="./js/stations/yoyogi.js"></script>
    <script src="./js/stations/akabanebashi.js"></script>
    <script src="./js/stations/aoyama_itchome.js"></script>
    <script src="./js/stations/azabu_juban.js"></script>
    <script src="./js/stations/daimon.js"></script>
    <script src="./js/stations/higaashi_shinjuku.js"></script>
    <script src="./js/stations/kokuritsu_kyogijo.js"></script>
    <script src="./js/stations/roppongi.js"></script>
    <script src="./js/stations/shinjuku_nishiguchi.js"></script>
    <script src="./js/stations/tochomae.js"></script>
    <script src="./js/stations/ueno_okachimachi.js"></script>

    <!-- メインJavaScript -->
    <script src="./js/constants.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/route.js"></script>
    <script src="./js/route_animation.js"></script>
    <script src="./js/station.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/facility.js"></script>
    <script src="./js/info.js"></script>
    <script src="./js/main.js"></script>
</head>

<body>

    <div id="map"></div>
    <div class="info-panel">
        <b style="font-size: 1.0em; display: block; margin-bottom: 5px; color: #fff;">大江戸線</b><b
            style="font-size: 1.2em; display: block; margin-bottom: 5px; color: #fff;" id="station-name">駅 経路検索アプリ</b>
        <!-- ・フロア (Space): 階層別に色分け描画<br>
        ・経路 (Link): シアン色で3D接続<br>
        ・節点 (Node): 階層別に色分け<br> -->
        <!-- <div class="legend-item">
            <div class="line" style="background: #00ffff; color: #00ffff;"></div> 経路: Link (3D接続)
        </div>
        <div class="legend-item">
            <div class="dot" style="background: #38bdf8; color: #38bdf8;"></div> 節点: Node (階層別色分け)
        </div>
        <div class="legend-item">
            <div class="dot"
                style="background: rgba(100, 116, 139, 0.8); color: rgba(100, 116, 139, 0.8); border: 1px solid rgba(71, 85, 105, 0.8);">
            </div> 設備: Facility
        </div>
        <div class="legend-item">
            <div class="line" style="background: #ef4444; color: #ef4444;"></div> 検索経路: 最短経路
        </div>
        <small style="opacity: 0.6; display: block; margin-top: 10px; color: #94a3b8;">右ドラッグで回転、Ctrl+ドラッグで高度変更</small> -->
    </div>

    <div class="station-selector">
        <label for="station-select"
            style="display: block; margin-bottom: 8px; color: #38bdf8; font-weight: 500;">駅を選択:</label>
        <select id="station-select">
            <option value="">読み込み中...</option>
        </select>
    </div>

    <div class="route-search-panel">
        <div class="route-search-panel-header">
            <h3 style="margin: 0 0 12px 0; color: #38bdf8; font-size: 1em;">経路検索</h3>
            <button id="play-route-animation" class="play-route-btn" style="display: none;" title="経路アニメーションを再生">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
        </div>
        <div class="route-control">
            <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 0.85em;">出発点:</label>
            <div class="route-selection">
                <button id="select-start" class="route-btn">選択</button>
                <span id="start-info" class="route-info">未選択</span>
            </div>
        </div>
        <div class="route-control">
            <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 0.85em;">到着点:</label>
            <div class="route-selection">
                <button id="select-end" class="route-btn">選択</button>
                <span id="end-info" class="route-info">未選択</span>
            </div>
        </div>
        <div class="route-actions">
            <button id="clear-route" class="route-btn-secondary">クリア</button>
        </div>
    </div>

    <!-- 空間情報表示エリア（右下） -->
    <div id="space-info-panel" class="space-info-panel" style="display: none;">
        <div id="space-info-content"></div>
    </div>

    <!-- 設備一覧パネル -->
    <div id="facility-list-panel" class="facility-list-panel" style="display: none;">
        <div class="facility-list-header">
            <h3>設備一覧</h3>
            <div class="facility-list-header-buttons">
                <button id="close-facility-list" class="close-btn">×</button>
            </div>
        </div>
        <div id="facility-list-content" class="facility-list-content"></div>
    </div>

    <!-- 設備一覧ボタン -->
    <button id="toggle-facility-list" class="facility-list-toggle">設備一覧</button>

    <!-- トースト通知 -->
    <div id="toast" class="toast">
        <div class="toast-message"></div>
    </div>

</body>

</html>
