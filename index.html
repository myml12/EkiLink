<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>EkiLink</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="EkiLink" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

    <!-- deck.gl 本体 -->
    <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
    <!-- MapLibre/Mapbox連携用の追加ライブラリ -->
    <script src="https://unpkg.com/@deck.gl/mapbox@8.9.33/dist.min.js"></script>

    <!-- カスタムCSS -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- 駅ごとのJavaScriptファイル -->
    <script src="./js/stations/shinjuku.js"></script>
    <script src="./js/stations/yoyogi.js"></script>
    <script src="./js/stations/akabanebashi.js"></script>
    <script src="./js/stations/aoyama_itchome.js"></script>
    <script src="./js/stations/azabu_juban.js"></script>
    <script src="./js/stations/daimon.js"></script>
    <script src="./js/stations/higaashi_shinjuku.js"></script>
    <script src="./js/stations/kokuritsu_kyogijo.js"></script>
    <script src="./js/stations/roppongi.js"></script>
    <script src="./js/stations/shinjuku_nishiguchi.js"></script>
    <script src="./js/stations/tochomae.js"></script>
    <script src="./js/stations/ueno_okachimachi.js"></script>

    <!-- メインJavaScript -->
    <!-- 依存関係の読み込み順序:
         1. constants.js - グローバル定数
         2. utils.js - ユーティリティ関数（calculateDistance等）
         3. facility.js - 施設関連関数（getFacilityCategoryName等）
         4. route.js - 経路検索ロジック
         5. route_animation.js - アニメーション機能
         6. navigation_modal.js - 道案内モーダル（facility.jsとutils.jsに依存）
         7. その他のモジュール
    -->
    <script src="./js/constants.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/facility.js"></script>
    <script src="./js/route.js"></script>
    <script src="./js/route_animation.js"></script>
    <script src="./js/navigation_modal.js"></script>
    <script src="./js/floor_plan.js"></script>
    <script src="./js/station.js"></script>
    <script src="./js/map.js"></script>
    <script src="./js/info.js"></script>
    <script src="./js/main.js"></script>
</head>

<body>

    <div id="map"></div>
    
    <!-- Left-side panel: Station info and selector -->
    <div class="info-panel">
        <b style="font-size: 1.0em; display: block; margin-bottom: 5px; color: #fff;">大江戸線</b>
        <b style="font-size: 1.2em; display: block; margin-bottom: 10px; color: #fff;" id="station-name">駅 経路検索アプリ</b>
        
        <!-- Station selector moved here for better UX -->
        <div class="station-selector-inline">
            <label for="station-select" style="display: block; margin-bottom: 8px; color: #38bdf8; font-weight: 500;">駅を選択:</label>
            <select id="station-select">
                <option value="">読み込み中...</option>
            </select>
        </div>
        
        <!-- Hierarchy display controls -->
        <div class="hierarchy-controls">
            <div class="hierarchy-control-header">
                <span style="color: #38bdf8; font-weight: 500;">階層表示</span>
            </div>
            <div class="hierarchy-toggle-row">
                <label class="toggle-switch">
                    <input type="checkbox" id="hierarchy-display-toggle">
                    <span class="toggle-slider"></span>
                </label>
                <span class="toggle-label">階層別表示</span>
            </div>
            <div class="floor-selector-dropdown" id="floor-selector-dropdown">
                <label for="floor-select" style="display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 0.85em;">表示する階層:</label>
                <select id="floor-select" class="floor-select">
                    <option value="all">全階層</option>
                </select>
            </div>
        </div>
    </div>

    <div class="route-search-panel">
        <div class="route-search-panel-header">
            <h3 style="margin: 0; color: #38bdf8; font-size: 1.1em; font-weight: 600;">経路検索</h3>
            <button id="play-route-animation" class="play-route-btn" style="display: none;" title="経路アニメーションを再生">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
        </div>
        
        <!-- 出発点セクション -->
        <div class="route-control-section">
            <div class="route-section-header">
                <div class="route-section-icon start-icon">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="8"/>
                    </svg>
                </div>
                <span class="route-section-label">出発点</span>
            </div>
            <div class="route-selection-buttons">
                <button id="select-start-point" class="route-select-btn" data-type="start" data-mode="point" title="マップ上のポイントをタップ">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    ポイント
                </button>
                <button id="select-start-facility" class="route-select-btn" data-type="start" data-mode="facility" title="施設一覧から選択">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
                    </svg>
                    施設
                </button>
            </div>
            <div class="route-selected-info" id="start-info-container">
                <span id="start-info" class="route-info-text">未選択</span>
            </div>
        </div>
        
        <!-- 矢印アイコン -->
        <div class="route-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" opacity="0.5">
                <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
            </svg>
        </div>
        
        <!-- 到着点セクション -->
        <div class="route-control-section">
            <div class="route-section-header">
                <div class="route-section-icon end-icon">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/>
                    </svg>
                </div>
                <span class="route-section-label">到着点</span>
            </div>
            <div class="route-selection-buttons">
                <button id="select-end-point" class="route-select-btn" data-type="end" data-mode="point" title="マップ上のポイントをタップ">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    ポイント
                </button>
                <button id="select-end-facility" class="route-select-btn" data-type="end" data-mode="facility" title="施設一覧から選択">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/>
                    </svg>
                    施設
                </button>
            </div>
            <div class="route-selected-info" id="end-info-container">
                <span id="end-info" class="route-info-text">未選択</span>
            </div>
        </div>
        
        <div class="route-actions">
            <button id="clear-route" class="route-btn-secondary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
                クリア
            </button>
        </div>
    </div>

    <!-- 空間情報表示エリア（右下） -->
    <div id="space-info-panel" class="space-info-panel" style="display: none;">
        <div id="space-info-content"></div>
    </div>

    <!-- 道案内モーダルウィンドウ（右側） -->
    <!-- コメントアウト: 道案内モーダルは見にくいため一時的に非表示
    <div id="navigation-modal" class="navigation-modal" style="display: none;">
        <div class="navigation-modal-header">
            <h3>道案内</h3>
            <button id="close-navigation-modal" class="navigation-close-btn" title="閉じる">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div id="navigation-steps" class="navigation-steps">
            <!-- ナビゲーションステップがここに表示される -->
        </div>
    </div>
    -->

    <!-- トースト通知 -->
    <div id="toast" class="toast">
        <div class="toast-message"></div>
    </div>

</body>

</html>
